# FreeRADIUS Platform v26.10.1 with FreeRADIUS 3.2 and integrated audit exporter
services:
  radius-service:
    image: ${RADIUS_IMAGE:-yuhongwei1997/radius-ent:radius-server-v26.10.1}
    container_name: radius-azure-v26.10.1
    environment:
      - AUDIT_API_TOKEN_FILE=/runtime/freeradius-platform/secrets/audit_api_token
      - AUDIT_STREAM_FILE_PATH=/var/log/freeradius/audit_stream.jsonl
      - AUDIT_EXPORTER_PORT=9090
    volumes:
      - ./runtime/radius/config:/runtime/radius/config
      - ./runtime/radius/certs:/runtime/radius/certs
      - ./runtime/freeradius-platform/secrets:/runtime/freeradius-platform/secrets
      - ./logs:/var/log/freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "14"
        compress: "true"
    healthcheck:
      test: ["CMD-SHELL", "radtest healthcheck healthcheck 127.0.0.1 0 testing123 2>&1 | grep -q 'Received Access-' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  freeradius-platform:
    depends_on:
      radius-service:
        condition: service_started
    image: ${PLATFORM_IMAGE:-yuhongwei1997/radius-ent:radius-platform-v26.10.1}
    container_name: freeradius-platform
    environment:
      - FREERADIUS_PLATFORM_DATA_ROOT=/data/runtime
      - AUDIT_EXPORTER_UPSTREAM=http://radius-service:9090
      - FREERADIUS_PLATFORM_ADMIN_USERNAME=${FREERADIUS_PLATFORM_ADMIN_USERNAME:-admin}
      - FREERADIUS_PLATFORM_ADMIN_PASSWORD=${FREERADIUS_PLATFORM_ADMIN_PASSWORD:-admin123}
      - FREERADIUS_PLATFORM_SESSION_HTTPS_ONLY=${FREERADIUS_PLATFORM_SESSION_HTTPS_ONLY:-false}
    volumes:
      - ./runtime:/data/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${FREERADIUS_PLATFORM_PORT:-8089}:8080"
    restart: unless-stopped
